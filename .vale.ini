# Prose linting for the writing in this repo: blog posts, launch copy, plans.
# Two packages, both aimed at the thing ste-lint.py cannot see — prose that
# reads as machine-written rather than merely complex:
#   ai-tells   137 rules: stock openers and closings, hedges, vague
#              attributions, participial padding, copula dodges, formulaic
#              transitions, figurative verbs, em-dash chains.
#   Slop        32 rules: metaphor masking mechanism, self-praise instead of
#              explanation, buzzwords, chat voice in formal writing.
# vale-llm-slop's STE style is deliberately NOT enabled: ste-lint.py already
# covers ASD-STE100 for this repo, and STE's no-contractions rule is wrong
# for the conversational registers (Reddit, X, HN comments).
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = ai-tells, \
  https://github.com/Syntaf/vale-llm-slop/releases/latest/download/vale-llm-slop.zip

[*.md]
BasedOnStyles = ai-tells, Slop

# Rules switched off because they fight this repo's actual subject matter,
# not because the writing wants an exemption:
#   FigurativeShape  "shape" is the central technical term of ivue and of the
#                    standard ("one shape everywhere"); it names a real thing.
#   FigurativeEarns  "a case that earns it" is house vocabulary for a
#                    justified exception, used in the skill and the contracts.
#   ShipOveruse      "ships" is domain vocabulary for releasing software.
ai-tells.FigurativeShape = NO
ai-tells.FigurativeEarns = NO
ai-tells.ShipOveruse = NO

# ---------------------------------------------------------------------------
# The operating manual and its docs mirror are a NORMATIVE SPEC, not prose
# that persuades. Several ai-tells rules are tuned for the latter and damage
# the former, so they are off for these two files only. Every other markdown
# file in the repo is still held to the full set.
[{.claude/skills/ivue/SKILL.md,docs_v2/guide/standard.md}]
#   Defined vocabulary. "seam", "knob", "surface", "slot" and "outliving"
#   name real things here, are used by the gate checks and the invariants
#   contracts, and renaming them would break one-name-for-one-thing.
ai-tells.FigurativeNouns = NO
ai-tells.MortalityMetaphors = NO
ai-tells.FusionMetaphors = NO
#   Placement language. "a member carries a doc comment", "logic lives on the
#   class" — a standard about where code goes says where code goes.
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeLives = NO
#   Prohibitions are the content. "no mutable plain fields", "never one getter
#   per key", "allocate no scope" — stating the positive instead would delete
#   the rule.
ai-tells.ContrastiveNegation = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.StackedAnaphora = NO
#   A rule's scope is universal by nature. "Every behavioral SFC has exactly
#   one ivue class" is the rule, and "say which cases were checked" does not
#   apply to it.
ai-tells.UniversalSubject = NO
ai-tells.UniversalObject = NO
#   Closed sets of three. Three visibility tiers, three hot-loop moves, three
#   residents of a class file. The count is a fact, not a cadence.
ai-tells.VerbTricolon = NO
#   Notation. The member order is written as an arrow sequence, and
#   "de-optimize" is the JavaScript engine term, matched on a substring.
ai-tells.NounString = NO
ai-tells.FormalRegister = NO
