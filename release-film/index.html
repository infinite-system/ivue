<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ivue — Infinite by design</title>
  <style>
    @font-face { font-family: Geist; src: url('./assets/geist-latin.woff2'); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html,body { margin: 0; min-height: 100%; background: #03060c; color: #eff5ff; font-family: Geist, sans-serif; }
    body { display: grid; min-height: 100dvh; place-content: center; }
    main { width: min(100vw, 1600px); }
    #stage { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #03060c; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #picture { opacity: 0; pointer-events: none; }
    #type { pointer-events: none; }
    nav { padding: 18px 24px; display:flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button,a { color: #c4d4e6; font: inherit; font-size: 13px; background: transparent; border: 1px solid #283345; border-radius: 6px; padding: 9px 15px; text-decoration: none; cursor: pointer; }
    button:hover,a:hover { border-color: #67ddc8; color: white; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline: 2px solid #67ddc8; outline-offset: 4px; }
    input { flex: 1; min-width: 100px; accent-color: #6ce6d0; }
    #clock { font-size: 12px; font-variant-numeric: tabular-nums; color: #a0aec1; }
    #status { padding: 0 24px 20px; color: #a0aec1; font-size: 12px; }
    .render nav,.render #status { display: none; }
    .render main { width: 100vw; }
  </style>
</head>
<body>
  <main>
    <div id="stage" role="img" aria-label="ivue release film: a three-dimensional infinity block transforms into different objects, demonstrating shared behavior and state created on first access.">
      <canvas id="picture"></canvas><canvas id="type"></canvas>
    </div>
    <nav aria-label="Film controls">
      <button id="play" type="button">Play with sound</button>
      <button id="restart" type="button">Restart</button>
      <input id="seek" type="range" min="0" max="48" step="0.01" value="0" aria-label="Film position">
      <span id="clock">0:00 / 0:48</span>
      <a id="version" href="?version=objects">Bouncing objects ↗</a>
    </nav>
    <div id="status" role="status">Preparing the film…</div>
  </main>
  <script type="module" src="./film.mjs"></script>
</body>
</html>
