name: ci
on: [ push ]

jobs:
  build:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: yarn install
        uses: borales/actions-yarn@v4
        with:
          cmd: install # will run `yarn install` command
          # dir: 'ivue'
      - name: vitest ivue
        uses: borales/actions-yarn@v4
        with:
          cmd: test # will run `yarn test` command
          # dir: 'ivue'
  docs-deploy:
    name: deploy docs (v2)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: Setup git
        run: |
          git config user.name "Evgeny Kalashnikov" && git config user.email "ekalashnikov@gmail.com"
      - name: install root deps
        run: yarn install
      - name: install docs_v2 deps
        run: npm install --prefix docs_v2
      - name: build docs_v2
        run: npm run build:docs
      - name: deploy docs_v2 to gh-pages
        run: node docs_v2/scripts/gh-pages-deploy.js
      - name: warm StackBlitz playground
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          node docs_v2/scripts/warm-stackblitz.mjs
