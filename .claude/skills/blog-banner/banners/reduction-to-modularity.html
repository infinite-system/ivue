<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 300 800;
    src: url(./fonts/geist-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 400 600;
    src: url(./fonts/geist-mono-latin.woff2) format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(1000px 560px at 50% -20%, rgba(99, 102, 241, 0.25), transparent 60%),
      radial-gradient(900px 560px at 50% 130%, rgba(34, 211, 238, 0.14), transparent 55%),
      #050a18;
    font-family: 'Geist', 'DejaVu Sans', 'Inter', sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
  }
  .mono { font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace; }
  .quote {
    position: absolute; top: 116px; width: 1200px; text-align: center;
    font-size: 22px; font-style: italic; color: #7e9cd0;
  }
  .quote .said { color: #93c5fd; }
  .title {
    position: absolute; top: 196px; width: 1200px; text-align: center;
    font-size: 60px; font-weight: 750; color: #eaf2ff;
    text-shadow: 0 0 44px rgba(59, 130, 246, 0.5); line-height: 1.22;
  }
  .title .glow { color: #67e8f9; text-shadow: 0 0 34px rgba(34, 211, 238, 0.8); }
  .split {
    position: absolute; top: 356px; width: 1200px;
    display: flex; justify-content: center; align-items: center; gap: 26px;
  }
  .mono-block {
    padding: 16px 26px; border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.4); color: #94a3b8;
    font-size: 21px;
  }
  .arrow { font-size: 30px; color: #3d5d9c; }
  .plugins { display: flex; gap: 12px; }
  .plugin {
    padding: 9px 16px; border-radius: 9px; font-size: 18px;
    border: 1px solid rgba(96, 165, 250, 0.45); color: #93c5fd;
  }
  .rule {
    position: absolute; top: 452px; left: 420px; width: 360px; height: 2px;
    background: linear-gradient(90deg, rgba(34,211,238,0), rgba(34,211,238,0.85), rgba(34,211,238,0));
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.7);
  }
  .footer {
    position: absolute; top: 482px; width: 1200px; text-align: center;
    font-size: 21px; color: #52688f; line-height: 1.6;
  }
  .footer b { color: #93c5fd; font-weight: 500; }
  .lockup {
    position: absolute; top: 34px; left: 44px;
  }
  .lockup img { display: block; width: 178px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="lockup">
    <img src="../../../../docs_v2/public/brand-lockup-dark.png" alt="ivue — Infinite Vue" />
  </div>

  <div class="quote"><span class="said">"the glyph for git is kinda sucky though"</span> — the entire design review</div>
  <div class="title">From monolith to <span class="glow">modular design</span><br/>in a day</div>
  <div class="split">
    <div class="mono-block">monolith</div>
    <div class="arrow">→</div>
    <div class="plugins">
      <span class="plugin">git</span>
      <span class="plugin">markdown</span>
      <span class="plugin">file tree</span>
      <span class="plugin">settings</span>
      <span class="plugin">keybindings</span>
    </div>
  </div>
  <div class="rule"></div>
  <div class="footer">76 gated commits in one day — the care lives in <b>contracts, gates, and the substrate</b></div>
</body>
</html>
