<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 300 800;
    src: url(./fonts/geist-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 400 600;
    src: url(./fonts/geist-mono-latin.woff2) format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(1000px 560px at 50% -20%, rgba(99, 102, 241, 0.25), transparent 60%),
      radial-gradient(900px 560px at 50% 130%, rgba(34, 211, 238, 0.14), transparent 55%),
      #050a18;
    font-family: 'Geist', 'DejaVu Sans', 'Inter', sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
  }
  .langs {
    position: absolute; top: 96px; width: 1200px;
    display: flex; justify-content: center; gap: 20px; align-items: center;
  }
  .lang {
    font-size: 20px; padding: 8px 18px; border-radius: 9px;
    border: 1px solid rgba(52, 211, 153, 0.4); color: #6ee7b7;
  }
  .lang .check { color: #34d399; }
  .lang.js {
    border-color: rgba(248, 113, 113, 0.55); color: #fca5a5;
    box-shadow: 0 0 24px rgba(248, 113, 113, 0.18);
  }
  .title {
    position: absolute; top: 218px; width: 1200px; text-align: center;
    font-size: 64px; font-weight: 700; color: #eaf2ff;
    text-shadow: 0 0 44px rgba(59, 130, 246, 0.5); line-height: 1.22;
  }
  .title .glow { color: #67e8f9; text-shadow: 0 0 34px rgba(34, 211, 238, 0.8); }
  .sub {
    position: absolute; top: 396px; width: 1200px; text-align: center;
    font-size: 24px; color: #7e9cd0; line-height: 1.6;
  }
  .rule {
    position: absolute; top: 470px; left: 420px; width: 360px; height: 2px;
    background: linear-gradient(90deg, rgba(34,211,238,0), rgba(34,211,238,0.85), rgba(34,211,238,0));
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.7);
  }
  .footer {
    position: absolute; top: 500px; width: 1200px; text-align: center;
    font-size: 21px; color: #52688f;
  }
  .footer b { color: #93c5fd; font-weight: 500; }
  .mono { font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace; }
  .lockup {
    position: absolute; top: 34px; left: 44px;
  }
  .lockup img { display: block; width: 178px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="lockup">
    <img src="../../../../docs_v2/public/brand-lockup-dark.png" alt="ivue — Infinite Vue" />
  </div>

  <div class="langs">
    <span class="lang">Go <span class="check">✓</span></span>
    <span class="lang">Rust <span class="check">✓</span></span>
    <span class="lang">OCaml <span class="check">✓</span></span>
    <span class="lang">Swift <span class="check">✓</span></span>
    <span class="lang js">JavaScript ✗</span>
  </div>
  <div class="title">The constraint<br/>that <span class="glow">unlocks</span></div>
  <div class="sub">initialization order — solved in four languages,<br/>unsolved in the most-used one</div>
  <div class="rule"></div>
  <div class="footer">one idiom + a 200-line checker close the gap — then pay <b>three more dividends</b></div>
</body>
</html>
