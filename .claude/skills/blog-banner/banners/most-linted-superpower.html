<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 300 800;
    src: url(./fonts/geist-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 400 600;
    src: url(./fonts/geist-mono-latin.woff2) format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(1000px 560px at 50% -20%, rgba(99, 102, 241, 0.25), transparent 60%),
      radial-gradient(900px 560px at 50% 130%, rgba(34, 211, 238, 0.14), transparent 55%),
      #050a18;
    font-family: 'Geist', 'DejaVu Sans', 'Inter', sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
  }
  .mono { font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace; }
  .lints {
    position: absolute; top: 120px; width: 1200px;
    display: flex; justify-content: center; gap: 18px;
  }
  .lint {
    font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace;
    font-size: 18px; padding: 8px 16px; border-radius: 9px;
    border: 1px solid rgba(251, 191, 36, 0.45); color: #fcd34d;
  }
  .lint .warn { color: #fbbf24; }
  .title {
    position: absolute; top: 204px; width: 1200px; text-align: center;
    font-size: 64px; font-weight: 750; color: #eaf2ff;
    text-shadow: 0 0 44px rgba(59, 130, 246, 0.5); line-height: 1.22;
  }
  .title .glow { color: #67e8f9; text-shadow: 0 0 34px rgba(34, 211, 238, 0.8); }
  .code {
    position: absolute; top: 386px; width: 1200px; text-align: center;
    font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace;
    font-size: 27px; color: #b7cdf3;
  }
  .code .kw { color: #818cf8; } .code .cls { color: #67e8f9; } .code .fn { color: #60a5fa; }
  .rule {
    position: absolute; top: 452px; left: 420px; width: 360px; height: 2px;
    background: linear-gradient(90deg, rgba(34,211,238,0), rgba(34,211,238,0.85), rgba(34,211,238,0));
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.7);
  }
  .footer {
    position: absolute; top: 482px; width: 1200px; text-align: center;
    font-size: 21px; color: #52688f; line-height: 1.6;
  }
  .footer b { color: #93c5fd; font-weight: 500; }
  .lockup {
    position: absolute; top: 34px; left: 44px;
  }
  .lockup img { display: block; width: 178px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="lockup">
    <img src="../../../../docs_v2/public/brand-lockup-dark.png" alt="ivue — Infinite Vue" />
  </div>

  <div class="lints">
    <span class="lint"><span class="warn">⚠</span> prefer-const</span>
    <span class="lint"><span class="warn">⚠</span> no-mutable-exports</span>
    <span class="lint"><span class="warn">⚠</span> no-param-reassign</span>
  </div>
  <div class="title">The most-linted features<br/>are the <span class="glow">superpower</span></div>
  <div class="code"><span class="kw">export let</span> <span class="cls">Class</span> = <span class="fn">Reactive</span>(<span class="cls">$Class</span>);</div>
  <div class="rule"></div>
  <div class="footer">mutable bindings + late-bound dispatch — the swappability<br/>no static language can reach, made safe by a referee</div>
</body>
</html>
