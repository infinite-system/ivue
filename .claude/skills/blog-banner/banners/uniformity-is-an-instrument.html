<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 300 800;
    src: url(./fonts/geist-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 400 600;
    src: url(./fonts/geist-mono-latin.woff2) format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(1000px 560px at 50% -20%, rgba(99, 102, 241, 0.25), transparent 60%),
      radial-gradient(900px 560px at 50% 130%, rgba(34, 211, 238, 0.14), transparent 55%),
      #050a18;
    font-family: 'Geist', 'DejaVu Sans', 'Inter', sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59, 130, 246, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(760px 480px at 50% 50%, black 25%, transparent 75%);
  }
  .mono { font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace; }
  /* the field of sameness, with one deviation made high-contrast */
  .field {
    position: absolute; top: 112px; left: 0; width: 1200px;
    display: flex; justify-content: center; gap: 13px;
  }
  .tick {
    width: 15px; height: 74px; border-radius: 4px;
    background: rgba(96, 165, 250, 0.16);
    border: 1px solid rgba(96, 165, 250, 0.26);
  }
  .tick.odd {
    background: rgba(248, 113, 113, 0.30);
    border-color: rgba(248, 113, 113, 0.95);
    box-shadow: 0 0 26px rgba(248, 113, 113, 0.65);
    transform: translateY(11px) rotate(7deg);
  }
  .title {
    position: absolute; top: 222px; width: 1200px; text-align: center;
    font-size: 62px; font-weight: 750; color: #eaf2ff;
    text-shadow: 0 0 44px rgba(59, 130, 246, 0.5); letter-spacing: -0.015em;
  }
  .title .glow { color: #67e8f9; text-shadow: 0 0 36px rgba(34, 211, 238, 0.8); }
  .sub {
    position: absolute; top: 328px; width: 1200px; text-align: center;
    font-size: 25px; color: #7e9cd0; line-height: 1.55;
  }
  .stats {
    position: absolute; top: 450px; width: 1200px;
    display: flex; justify-content: center; gap: 18px;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 13px 22px; border-radius: 11px;
    border: 1px solid rgba(96, 165, 250, 0.4);
  }
  .stat .n {
    font-family: 'Geist Mono', 'DejaVu Sans Mono', monospace;
    font-size: 27px; color: #67e8f9; text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
  }
  .stat .l { font-size: 16px; color: #7e9cd0; }
  .lockup {
    position: absolute; top: 34px; left: 44px;
  }
  .lockup img { display: block; width: 178px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="lockup">
    <img src="../../../../docs_v2/public/brand-lockup-dark.png" alt="ivue — Infinite Vue" />
  </div>

  <div class="field">
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick odd"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
    <span class="tick"></span><span class="tick"></span><span class="tick"></span>
  </div>
  <div class="title">Uniformity is <span class="glow">a measuring device</span></div>
  <div class="sub">deviation is only visible against sameness —<br/>so low structural entropy makes defects high-contrast</div>
  <div class="stats">
    <div class="stat"><span class="n">235/235</span><span class="l">classes conforming</span></div>
    <div class="stat"><span class="n">6</span><span class="l">AST checkers</span></div>
    <div class="stat"><span class="n">25</span><span class="l">contracts</span></div>
    <div class="stat"><span class="n">0</span><span class="l">cycle workarounds</span></div>
  </div>
</body>
</html>
