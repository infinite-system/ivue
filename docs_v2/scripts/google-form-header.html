<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ivue Google Form header</title>
    <style>
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 300 800;
        font-display: block;
        src: url('https://fonts.gstatic.com/s/geist/v5/gyByhwUxId8gMEwcGFU.woff2')
          format('woff2');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 400px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: 'Geist', sans-serif;
        background:
          radial-gradient(
            circle at 5% 0%,
            rgba(103, 108, 220, 0.16),
            transparent 34%
          ),
          radial-gradient(
            circle at 102% 112%,
            rgba(21, 139, 144, 0.2),
            transparent 43%
          ),
          linear-gradient(165deg, #181c40 0%, #090d23 52%, #082a35 100%);
      }

      .card {
        position: relative;
        width: 1600px;
        height: 400px;
        overflow: hidden;
      }

      .hero-mark {
        position: absolute;
        z-index: 0;
        top: -325px;
        right: -172px;
        width: 1050px;
        height: 1050px;
        opacity: 0.045;
        pointer-events: none;
      }

      /* ONE image from the single source of truth — the same move
         og-image.html makes. This used to hand-build the mark (a
         #0d1226 tile plus an inline teal infinity) beside a cropped
         slice of the wordmark, so a brand change updated the wordmark
         and left the tile on the old mark.
         Geometry preserved: the PNG is 993x384 with its 322px tile at
         (31,31), so 212.8px wide renders the tile at 69px and the
         6.64px transparent inset puts its visible corner back at
         (60,60) — where the hand-built tile sat. */
      .lockup {
        position: absolute;
        z-index: 1;
        top: 53.36px;
        left: 53.36px;
        width: 212.8px;
        height: auto;
        display: block;
      }

      .headline {
        position: absolute;
        z-index: 1;
        top: 155px;
        left: 60px;
        display: grid;
        grid-template-columns: 330px 430px;
        column-gap: 58px;
        margin: 0;
        color: #f0f2ff;
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }

      .headline > span,
      .headline > span > span {
        display: block;
      }

      .headline > span > span {
        width: max-content;
      }

      .headline .scalability {
        background: linear-gradient(
          105deg,
          #7dd3fc 0%,
          #38bdf8 72%,
          #7dd3fc 100%
        );
        background-clip: text;
        color: transparent;
      }

      .headline .kilobyte {
        background: linear-gradient(
          105deg,
          #818cf8 4%,
          #3b82f6 47%,
          #34d399 100%
        );
        background-clip: text;
        color: transparent;
      }

      .metrics {
        position: absolute;
        z-index: 1;
        bottom: 60px;
        left: 60px;
        display: grid;
        grid-template-columns: 330px 430px;
        column-gap: 58px;
        align-items: baseline;
        color: #9198c6;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 1;
        white-space: nowrap;
      }

      .metrics strong {
        color: #f0f2ff;
        font-weight: 700;
      }

      .metric-group {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .metric-group:last-child {
        padding-right: 20px;
        padding-left: 2px;
      }

      .metric-group:first-child {
        padding-right: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="hero-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path
          d="M10.6 24 C 10.6 17.6, 19 17, 24 24 C 29 31, 37.4 30.4, 37.4 24 C 37.4 17.6, 29 17, 24 24 C 19 31, 10.6 30.4, 10.6 24 Z"
          stroke="url(#hero-mark-gradient)"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <defs>
          <linearGradient
            id="hero-mark-gradient"
            x1="8"
            y1="14"
            x2="40"
            y2="34"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#818cf8" />
            <stop offset="1" stop-color="#34d399" />
          </linearGradient>
        </defs>
      </svg>

      <img
        class="lockup"
        src="../public/brand-lockup-dark.png"
        alt="ivue — Infinite Vue"
      />

      <h1 class="headline">
        <span>
          <span>Plain classes.</span>
          <span>Full reactivity.</span>
        </span>
        <span>
          <span class="scalability">Infinite scalability.</span>
          <span class="kilobyte">One kilobyte.</span>
        </span>
      </h1>

      <div class="metrics">
        <span class="metric-group">
          <span><strong>1.1 kB</strong> gzipped</span>
          <span><strong>0</strong> dependencies</span>
        </span>
        <span class="metric-group">
          <span><strong>100%</strong> test coverage</span>
          <span><strong>22 ms</strong> / 1M instances</span>
        </span>
      </div>
    </main>
  </body>
</html>
